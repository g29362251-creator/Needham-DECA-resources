<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Needham DECA — Resource Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-900:#0A2472;
    --blue-700:#12379C;
    --blue-600:#1656D6;
    --blue-500:#2E6BFF;
    --blue-tint:#EAF0FF;
    --gold:#E3A62F;
    --gold-deep:#B9821E;
    --bg:#F4F6FB;
    --card:#FFFFFF;
    --ink:#101323;
    --ink-soft:#5B6178;
    --rule:#E4E8F2;
    box-sizing:border-box;
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:calc(64px + env(safe-area-inset-top,0px));}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100%;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0B0F1A; --card:#141A2A; --ink:#EDEFF7; --ink-soft:#9BA2BC;
      --rule:#232B40; --blue-tint:#132247;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0B0F1A; --card:#141A2A; --ink:#EDEFF7; --ink-soft:#9BA2BC;
    --rule:#232B40; --blue-tint:#132247;
  }

  .appbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--blue-900),var(--blue-600));
    padding:calc(.85rem + env(safe-area-inset-top,0px)) 1.1rem .85rem;
    display:flex; align-items:center; gap:.6rem;
    box-shadow:0 2px 14px rgba(10,36,114,.18);
  }
  .appbar .mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;color:var(--blue-900);font-family:'Manrope',sans-serif;
    font-size:1.05rem;flex:none;
  }
  .appbar-text{min-width:0;}
  .appbar-title{
    color:#fff; font-family:'Manrope',sans-serif; font-weight:800;
    font-size:1.05rem; margin:0; line-height:1.1;
  }
  .appbar-sub{
    color:#C7D6FF; font-size:.74rem; margin:.1rem 0 0; font-weight:500;
  }

  main{
    max-width:640px;margin:0 auto;
    padding:1.1rem 1rem calc(96px + env(safe-area-inset-bottom,0px));
  }
  .panel{display:none;}
  .panel.active{display:block; animation:fade .18s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:none;}}

  .cluster-head{
    display:flex; align-items:center; gap:.6rem; margin-bottom:1rem;
  }
  .cluster-head .emoji{font-size:1.6rem;line-height:1;}
  .cluster-head h1{
    font-family:'Manrope',sans-serif; font-weight:800;
    font-size:1.3rem; margin:0; color:var(--ink);
  }

  .section-label{
    font-family:'Manrope',sans-serif; font-weight:700;
    font-size:.78rem; text-transform:uppercase; letter-spacing:.06em;
    color:var(--blue-600); margin:1.4rem 0 .6rem;
  }
  .section-label:first-of-type{margin-top:0;}

  .info-box{
    background:var(--blue-tint);
    border:1px solid var(--blue-500);
    border-radius:14px;
    padding:.8rem .95rem;
    font-size:.84rem;
    line-height:1.45;
    color:var(--ink);
    margin-bottom:1.1rem;
  }
  .info-box b{color:var(--blue-700);}
  :root[data-theme="dark"] .info-box b, @media (prefers-color-scheme: dark){ .info-box b{color:#8FB2FF;} }
  .info-box .tagex{
    display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;
    color:#fff;background:var(--gold-deep);border-radius:5px;padding:.05rem .4rem;
    margin:0 .1rem;
  }

  .test-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:.55rem;
    margin-bottom:.4rem;
  }
  .test-link{
    display:flex; align-items:center;
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:.75rem .8rem;
    color:var(--ink);
    text-decoration:none;
    font-size:.83rem;
    font-weight:600;
    line-height:1.3;
    box-shadow:0 1px 2px rgba(16,19,35,.04);
  }
  .test-link:active{transform:scale(.98);}
  .test-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .rp-card{
    background:var(--card);
    border:1px solid var(--rule);
    border-radius:16px;
    padding:1rem 1.05rem 1.05rem;
    margin-bottom:.75rem;
    box-shadow:0 1px 3px rgba(16,19,35,.05);
  }
  .rp-title{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:1rem;
    margin:0 0 .25rem;
    color:var(--ink);
  }
  .rp-area{
    font-size:.76rem;
    color:var(--gold-deep);
    font-weight:700;
    margin:0 0 .7rem;
  }
  .rp-links{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:.45rem;}
  .rp-links a{
    display:inline-flex;
    align-items:center;
    gap:.35rem;
    background:var(--blue-tint);
    border:1px solid transparent;
    border-radius:10px;
    padding:.4rem .65rem;
    font-size:.78rem;
    font-weight:600;
    color:var(--blue-700);
    text-decoration:none;
  }
  :root[data-theme="dark"] .rp-links a{color:#9FC0FF;}
  .rp-links a:active{transform:scale(.97);}
  .rp-links a span.tag{
    font-size:.65rem;
    color:#fff;
    background:var(--gold-deep);
    border-radius:4px;
    padding:.05rem .38rem;
    font-weight:700;
  }
  .empty-note{color:var(--ink-soft);font-size:.85rem;font-style:italic;}

  /* Home panel */
  .hero{
    background:linear-gradient(150deg,var(--blue-900),var(--blue-600));
    border-radius:20px;
    padding:1.4rem 1.3rem 1.5rem;
    color:#fff;
    margin-bottom:1.3rem;
  }
  .hero .eyebrow{
    color:var(--gold); font-weight:800; font-size:.72rem;
    text-transform:uppercase; letter-spacing:.08em; margin:0 0 .35rem;
  }
  .hero h1{
    font-family:'Manrope',sans-serif; font-weight:800;
    font-size:1.45rem; margin:0 0 .55rem; line-height:1.15;
  }
  .hero p{
    color:#D7E0FF; font-size:.88rem; line-height:1.5; margin:0;
  }
  .howto{
    display:flex; flex-direction:column; gap:.5rem;
    margin-bottom:1.5rem;
  }
  .howto .step{
    display:flex; gap:.7rem; align-items:flex-start;
    background:var(--card); border:1px solid var(--rule);
    border-radius:12px; padding:.7rem .8rem;
  }
  .howto .num{
    flex:none; width:24px; height:24px; border-radius:50%;
    background:var(--gold); color:var(--blue-900);
    font-family:'Manrope',sans-serif; font-weight:800; font-size:.78rem;
    display:flex; align-items:center; justify-content:center;
  }
  .howto .txt{font-size:.83rem; line-height:1.4; color:var(--ink);}
  .howto .txt b{color:var(--blue-700);}

  .cluster-cards{display:flex; flex-direction:column; gap:.65rem;}
  .cluster-card{
    display:flex; align-items:center; gap:.8rem;
    background:var(--card); border:1px solid var(--rule);
    border-radius:16px; padding:.85rem .95rem;
    text-align:left; cursor:pointer;
    box-shadow:0 1px 3px rgba(16,19,35,.05);
  }
  .cluster-card:active{transform:scale(.98);}
  .cluster-card .cc-emoji{
    flex:none; font-size:1.5rem;
    width:42px; height:42px; border-radius:12px;
    background:var(--blue-tint);
    display:flex; align-items:center; justify-content:center;
  }
  .cluster-card .cc-body{min-width:0;}
  .cluster-card .cc-title{
    font-family:'Manrope',sans-serif; font-weight:700; font-size:.94rem;
    margin:0 0 .15rem; color:var(--ink);
  }
  .cluster-card .cc-desc{
    font-size:.78rem; color:var(--ink-soft); line-height:1.35; margin:0;
  }
  .cluster-card .cc-arrow{
    flex:none; color:var(--blue-500); font-size:1.1rem; font-weight:700;
  }

  nav.tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:var(--card);
    border-top:1px solid var(--rule);
    padding:.4rem .3rem calc(.4rem + env(safe-area-inset-bottom,0px));
    display:flex;
    box-shadow:0 -2px 14px rgba(16,19,35,.06);
    overflow-x:auto;
  }
  nav.tabbar button{
    flex:1; min-width:56px;
    display:flex; flex-direction:column; align-items:center; gap:.18rem;
    background:none; border:none;
    padding:.3rem .1rem;
    font-family:'Inter',sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
  }
  nav.tabbar button .ic{font-size:1.25rem;line-height:1;}
  nav.tabbar button .lbl{
    font-size:.6rem; font-weight:700;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  nav.tabbar button[aria-selected="true"]{color:var(--blue-600);}
  nav.tabbar button[aria-selected="true"] .lbl{color:var(--blue-600);}
  nav.tabbar button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:8px;}
</style>
</head>
<body>

  <div class="appbar-text">
    <p class="appbar-title">Needham DECA</p>
    <p class="appbar-sub" id="appbar-sub">Resource Hub</p>
  </div>
</div>

<main id="main"></main>

homeBtn.dataset.id = 'home';

  card.innerHTML = `<span class="cc-emoji">${ICONS[c.id]||'📄'}</span><span class="cc-body"><p class="cc-title">${esc(c.name)}</p><p class="cc-desc">${esc(DESCRIPTIONS[c.id]||'')}</p></span><span class="cc-arrow">›</span>`;
  card.addEventListener('click', ()=>selectCluster(c.id));
  cardsWrap.appendChild(card);
});

// --- Cluster tabs + panels ---
DATA.forEach((c,i)=>{
  const btn = document.createElement('button');
  btn.setAttribute('role','tab');
  btn.setAttribute('aria-selected','false');
  btn.dataset.id = c.id;
  btn.innerHTML = `<span class="ic">${ICONS[c.id]||'📄'}</span><span class="lbl">${SHORT[c.id]||c.name}</span>`;
  btn.addEventListener('click', ()=>selectCluster(c.id));
  tabbar.appendChild(btn);

  const panel = document.createElement('section');
  panel.className = 'panel';
  panel.id = 'panel-'+c.id;

  let h = `<div class="cluster-head"><span class="emoji">${ICONS[c.id]||'📄'}</span><h1>${esc(c.name)}</h1></div>`;

  h += '<h2 class="section-label">Practice Tests &amp; Exam Resources</h2><div class="test-grid">';
  c.tests.forEach(([label,url])=>{
    h += `<a class="test-link" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  });
  h += '</div>';

  if(c.roleplays.length){
    h += '<h2 class="section-label">Sample Role-Plays</h2>';
    h += `<div class="info-box"><b>What the tags mean:</b> the gold tag on a link is the exact district-level instructional area that role-play was built around — the same instructional area you'll see listed on your competitive event at districts. Where a series has two scenario versions, each is tagged with its own instructional area (both are listed below the event name); pick the download that matches the area you were assigned.</div>`;
    c.roleplays.forEach(([title,areas,links])=>{
      h += `<div class="rp-card"><h3 class="rp-title">${esc(title)}</h3><p class="rp-area">${esc(areas)}</p><ul class="rp-links">`;
      links.forEach(([label,url,tag])=>{
        h += `<li><a href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}${tag?` <span class="tag">${esc(tag)}</span>`:''}</a></li>`;
      });
      h += '</ul></div>';
    });
  } else {
    h += '<p class="empty-note">No cluster-specific role-plays listed — see exam resources above.</p>';
  }

  panel.innerHTML = h;
  main.appendChild(panel);
});

function selectCluster(id){
  document.querySelectorAll('nav.tabbar button').forEach(b=>b.setAttribute('aria-selected', b.dataset.id===id ? 'true':'false'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
  if(id === 'home'){
    appbarSub.textContent = 'Resource Hub';
  } else {
    const c = DATA.find(c=>c.id===id);
    appbarSub.textContent = c ? c.name : 'Resource Hub';
  }
  main.scrollTo(0,0);
  window.scrollTo(0,0);
}
</script>
</body>
</html>
